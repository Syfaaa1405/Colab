<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Menghitung Hasil Belanja</h2>
    <p id="hasil"></p>

    <script>
       let barang1 = "1 Pack Buku";
        let harga1 = 39000;
        let jumlah1 = 2;

        let barang2 = "Pensil";
        let harga2 = 4000;
        let jumlah2 = 2;

        let barang3 = "Penghapus";
        let harga3 = 3500;
        let jumlah3 = 1;

        let barang4 = "Penggaris";
        let harga4 = 5000;
        let jumlah4 = 1;

        let subtotal1 = harga1 * jumlah1;
        let subtotal2 = harga2 * jumlah2;
        let subtotal3 = harga3 * jumlah3;
        let subtotal4 = harga4 * jumlah4;

        let total = subtotal1 + subtotal2 + subtotal3 + subtotal4;

        document.getElementById("hasil").innerHTML =
            barang1 + " ( " + jumlah1 + " ) : Rp" + subtotal1 + "<br>" +
            barang2 + " ( " + jumlah2 + " ) : Rp" + subtotal2 + "<br>" +
            barang3 + " ( " + jumlah3 + " ) : Rp" + subtotal3 + "<br>" +
            barang4 + " ( " + jumlah4 + " ) : Rp" + subtotal4 + "<br><br>" +
            "<b>Total Belanja: Rp" + total + "</b>";
    </script>
    
</body>
</html>
