        .ekstra-container {

        .ekstra-option input {

        }

        /* ERROR */

    <!-- JAVASCRIPT -->
    <script>

        // Mengambil elemen form
        const form = document.getElementById("formPendaftaran");

        // Mengambil semua checkbox ekstrakurikuler
        const checkboxEkstra =
            document.querySelectorAll('input[name="ekstra[]"]');

        // Menampilkan jumlah pilihan ekstrakurikuler
        const jumlahEkstra =
            document.getElementById("jumlahEkstra");

        // Pesan error ekstrakurikuler
        const errorEkstra =
            document.getElementById("errorEkstra");

        // Nomor telepon
        const telp =
            document.getElementById("telp");

        // Pesan error nomor telepon
        const errorTelp =
            document.getElementById("errorTelp");


        // =====================================
        // MENGHITUNG JUMLAH EKSTRA YANG DIPILIH
        // =====================================

        checkboxEkstra.forEach(function (checkbox) {

            checkbox.addEventListener("change", function () {

                let jumlah = 0;

                checkboxEkstra.forEach(function (item) {

                    if (item.checked) {
                        jumlah++;
                    }

                });

                jumlahEkstra.textContent = jumlah;

                if (jumlah > 0) {
                    errorEkstra.style.display = "none";
                }

            });

        });


        // =====================================
        // VALIDASI FORM
        // =====================================

        form.addEventListener("submit", function (event) {

            let jumlahDipilih = 0;

            // Menghitung checkbox yang dipilih
            checkboxEkstra.forEach(function (checkbox) {

                if (checkbox.checked) {
                    jumlahDipilih++;
                }

            });


            // Jika belum memilih ekstrakurikuler
            if (jumlahDipilih === 0) {

                event.preventDefault();

                errorEkstra.style.display = "block";

                alert("Silakan pilih minimal 1 ekstrakurikuler.");

                return;
            }


            // Validasi nomor telepon
            const nomor = telp.value.trim();

            if (!/^[0-9]+$/.test(nomor)) {

                event.preventDefault();

                errorTelp.style.display = "block";

                alert("Nomor telepon hanya boleh berisi angka.");

                telp.focus();

                return;

            } else {

                errorTelp.style.display = "none";

            }


            // Konfirmasi sebelum dikirim
            const konfirmasi = confirm(
                "Apakah data yang Anda masukkan sudah benar?"
            );

            if (!konfirmasi) {

                event.preventDefault();

            }

        });


        // =====================================
        // RESET FORM
        // =====================================

        form.addEventListener("reset", function () {

            setTimeout(function () {

                jumlahEkstra.textContent = "0";

                errorEkstra.style.display = "none";

                errorTelp.style.display = "none";

            }, 10);

        });

    </script>
